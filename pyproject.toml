[tool.poetry]
name = "surprisingly-fair"
version = "0.1.0"
description = "Fairness in Recommendation Systems"
authors = ["Miguel Figueira Ferraz <miguelfigueiraferraz@gmail.com>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.12,<3.13"
joblib = "1.5.1"
numpy = ">=1.21.0,<2.0.0"
scikit-surprise = "1.1.4"
scipy = ">=1.7.0,<2.0.0"
pandas = ">=1.3.0"
fairlearn = ">=0.10.0"
seaborn = ">=0.12.0"
matplotlib = ">=3.5.0"

[tool.poetry.group.test.dependencies]
pytest = "8.4.0"
pytest-cov = "6.2.1"

[tool.poetry.group.dev.dependencies]
black = "25.1.0"
isort = "6.0.1"
unimport = "1.3.0"


[tool.black]
exclude = '.venv'
line-length = 120
target-version = ['py312']

[tool.isort]
skip = ['.venv']
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
line_length = 120

[tool.unimport]
exclude = '(__init__.py)|.venv'

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
