[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pfg-sis-rec"
version = "1.0.0"
description = "Recommendation Systems"
authors = [
    {name = "Miguel Figueira Ferraz", email = "miguelfigueiraferraz@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.8"

dependencies = [
    "joblib==1.5.1",
    "numpy>=1.21.0,<2.0.0",
    "scikit-surprise==1.1.4",
    "scipy>=1.7.0,<2.0.0",
    "pandas>=1.3.0",
]

[project.optional-dependencies]
dev = [
    "black>=23.0.0",
    "isort>=5.12.0",
    "flake8>=6.0.0",
]

[tool.black]
line-length = 120
target-version = ['py38', 'py39', 'py310', 'py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
  | archive
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 120
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.flake8]
max-line-length = 120
extend-ignore = ["E203", "W503", "E501"]
exclude = [".git", "__pycache__", "build", "dist", ".venv", "archive"]
